[project]
name = "cortex-learner"
version = "0.6.0"
description = "A local-first second brain: Markdown + JSONL vault, MCP server, CLI and skill."
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "mcp>=2.3,<3",
    "fsrs>=6.3,<7",
    "ruamel.yaml",
    "python-ulid",
    "typer",
    "fastembed>=0.9.1",
    "numpy",
    "truststore>=0.10.5",
    "pywebview>=6.2,<7 ; sys_platform == 'win32'",
    "pystray>=0.19.5,<0.20 ; sys_platform == 'win32'",
    "winrt-windows-security-credentials-ui>=4!10.0.28000.2957 ; sys_platform == 'win32'",
    # C2: Windows' own offline OCR reads scanned PDFs (more_sources._ocr)
    "winrt-windows-media-ocr>=4!10.0.28000.2957 ; sys_platform == 'win32'",
    "winrt-windows-graphics-imaging>=4!10.0.28000.2957 ; sys_platform == 'win32'",
    "winrt-windows-storage-streams>=4!10.0.28000.2957 ; sys_platform == 'win32'",
    "pypdf>=6.9.2,<7",
]

[project.optional-dependencies]
# voice memos: local transcription, installed only by `cortex model download --voice`
voice = ["faster-whisper==1.2.1"]

[project.scripts]
cortex = "cortex.taint:main"

[project.gui-scripts]
cortex-app = "cortex.app.launch:main"
cortex-receiver = "cortex.app.launch:receiver"

[dependency-groups]
dev = ["pytest", "pytest-xdist>=3.8.0", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cortex"]

[tool.hatch.build.targets.wheel.force-include]
# the dashboard's Help tab and glossary; the repo files stay the one source (dashboard._help)
"skills/cortex/modes/help.md" = "cortex/assets/help/help.md"
"docs/GUIDE.md" = "cortex/assets/help/GUIDE.md"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
markers = ["slow: takes over ~10 s (deselect with -m 'not slow')",
           "perf: a timing benchmark; skipped under -n, run alone with -m perf"]
