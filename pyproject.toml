[project]
name = "cortex-learner"
version = "0.1.0"
description = "A local-first learner model: Markdown + JSONL vault, MCP server, CLI and skill."
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "mcp>=2.3,<3",
    "fsrs>=6.3,<7",
    "ruamel.yaml",
    "python-ulid",
    "typer",
    "fastembed>=0.9.1",
    "numpy",
]

[project.scripts]
cortex = "cortex.taint:main"

[project.gui-scripts]
cortex-app = "cortex.app.launch:main"

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cortex"]

[tool.hatch.build.targets.wheel.force-include]
# the dashboard's Help tab and glossary; the repo files stay the one source (dashboard._help)
"skills/cortex/modes/help.md" = "cortex/assets/help/help.md"
"docs/GUIDE.md" = "cortex/assets/help/GUIDE.md"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
markers = ["slow: takes over ~10 s (deselect with -m 'not slow')"]
