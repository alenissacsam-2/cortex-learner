name: CI

# ruff and the quick test loop (`-m "not slow"`) on Windows (the platform Keepfold ships for),
# Linux and macOS (run from source), on every push to main and every pull request. The full
# suite stays a local step before a commit (CLAUDE.md). No secrets: tests use only
# tests/fixtures/ and temp folders.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      # GitHub's Windows VM scans every file the checkout and the tests write, which made the
      # quick suite about 18 min there against 2.5 on Ubuntu. The VM is thrown away after the run.
      - if: runner.os == 'Windows'
        run: Set-MpPreference -DisableRealtimeMonitoring $true
        shell: pwsh
        continue-on-error: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run pytest -n auto -m "not slow" -q
