<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Cortex capture</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <h1>Cortex capture</h1>
    <p id="status" class="status" role="status" aria-live="polite">Checking the receiver…</p>

    <div class="row">
      <button id="pause" type="button" aria-pressed="false">Pause</button>
      <button id="deny" type="button">Never on this site</button>
    </div>
    <p id="denied" class="small" role="status" aria-live="polite"></p>

    <dl class="stats">
      <div><dt>Sent today</dt><dd id="sent">0</dd></div>
      <div><dt>Waiting in queue</dt><dd id="queue">0</dd></div>
    </dl>

    <div class="row">
      <button id="process" type="button">Process now</button>
    </div>
    <p id="processed" class="small" role="status" aria-live="polite"></p>

    <form id="pair">
      <fieldset>
        <legend>Pairing</legend>
        <label for="port">Port</label>
        <input id="port" name="port" type="number" min="1024" max="65535" required>
        <label for="token">Token from <code>cortex browse pair</code></label>
        <input id="token" name="token" type="password" autocomplete="off" spellcheck="false"
               required>
        <button type="submit">Save and test</button>
      </fieldset>
    </form>

    <p class="note">Goes only to Cortex on this computer (127.0.0.1). Never in incognito,
      never form fields or passwords.</p>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
